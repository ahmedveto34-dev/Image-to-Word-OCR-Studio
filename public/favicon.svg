<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EAB308" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Inner Gold Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" />

  <!-- Document Sheet Layer Backing -->
  <path d="M148 112 H316 L376 172 V388 C376 401.25 365.25 412 352 412 H148 C134.75 412 124 401.25 124 388 V136 C124 122.75 134.75 112 148 112 Z" fill="#1E293B" stroke="#475569" stroke-width="4" />
  
  <!-- Folded Corner -->
  <path d="M316 112 V164 C316 168.4 319.6 172 324 172 H376 Z" fill="url(#goldGrad)" />

  <!-- Document Text Lines -->
  <rect x="168" y="196" width="130" height="14" rx="7" fill="url(#blueGrad)" />
  <rect x="168" y="232" width="176" height="12" rx="6" fill="#94A3B8" opacity="0.8" />
  <rect x="168" y="264" width="154" height="12" rx="6" fill="#94A3B8" opacity="0.8" />
  <rect x="168" y="296" width="120" height="12" rx="6" fill="#94A3B8" opacity="0.8" />

  <!-- Luxury Arabic 'W' & OCR Sparkles / Optical Beam in Gold -->
  <g filter="url(#glow)">
    <!-- Word 'W' Monogram / Emblem -->
    <rect x="250" y="280" width="150" height="110" rx="22" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="4" />
    <text x="325" y="358" font-family="'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="70" fill="url(#goldGrad)" text-anchor="middle">W</text>
  </g>

  <!-- Golden AI Sparkle Star -->
  <path d="M380 96 Q380 128 350 128 Q380 128 380 160 Q380 128 410 128 Q380 128 380 96 Z" fill="url(#goldGrad)" />
  <path d="M120 360 Q120 380 100 380 Q120 380 120 400 Q120 380 140 380 Q120 380 120 360 Z" fill="url(#goldGrad)" opacity="0.9" />
</svg>
